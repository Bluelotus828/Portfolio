name: Ping Upstash Redis (Every 3 Weeks)

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Redis client
        run: pip install redis

      - name: Ping Upstash Redis
        env:
          REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: |
          python -c "import os; from datetime import datetime; from redis import Redis; \
redis_url = os.environ.get('REDIS_URL'); \
assert redis_url.startswith('redis://') or redis_url.startswith('rediss://'), f'Invalid Redis URL: {redis_url}'; \
r = Redis.from_url(redis_url); \
r.set('keepalive', datetime.utcnow().isoformat(), ex=86400); \
print('[Upstash Ping] at', datetime.utcnow())"
