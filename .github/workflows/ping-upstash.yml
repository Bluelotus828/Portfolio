name: Ping Upstash Redis (Every 3 Weeks)

on:
  schedule:
    - cron: '0 3 1 * *'    # Executed on the 1st of every month at 3:00 AM UTC
    - cron: '0 3 27 * *'   # Executed on the 27st of every month at 3:00 AM UTC

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Redis client
        run: pip install redis

      - name: Ping Upstash Redis
        env:
          REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: |
          python -c "
import os
from datetime import datetime
from redis import Redis

r = Redis.from_url(os.environ['REDIS_URL'])
r.set('keepalive', datetime.utcnow().isoformat(), ex=86400)
print('[Upstash Ping] at', datetime.utcnow())
"
